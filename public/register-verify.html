<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verifikasi Akun — Yapari Bots</title>
<!-- @include head.html -->
</head>
<body class="page-auth">

<button class="theme-btn theme-btn-auth" data-act="toggleTheme" aria-label="Ganti tema" title="Ganti tema">
  <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<div class="auth-wrap">
  <div class="modal auth-card" style="text-align:center;">
    <div class="auth-page-icon">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
    </div>
    <h2>Verifikasi akun</h2>
    <p class="auth-desc" style="margin-bottom:16px;">Satu langkah lagi untuk aktivasi akun kamu.</p>

    <!-- State Loading -->
    <div id="state-loading" style="padding:24px 0;font-size:13.5px;color:var(--mute);">
      Memeriksa data verifikasi...
    </div>

    <!-- State Valid -->
    <div id="state-valid" style="display:none;">
      <div class="auth-info-box">
        <div class="auth-info-row">
          <div class="auth-info-avatar">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <div style="min-width:0;flex:1;">
            <div class="auth-info-name" id="user-name">...</div>
            <div class="auth-info-email" id="user-email">...</div>
          </div>
        </div>
      </div>

      <p class="auth-page-desc">
        Klik tombol di bawah untuk mengaktifkan akun kamu. Akun akan langsung aktif dan kamu bisa mulai memakai Yapari Bots.
      </p>

      <button type="button" class="btn-auth-submit" id="btn-confirm">
        Verifikasi Akunku →
      </button>
    </div>

    <!-- State Error -->
    <div id="state-error" style="display:none;">
      <div id="error-message" style="padding:14px 16px;border-radius:14px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:var(--red,#ef4444);font-size:13.5px;font-weight:600;margin-bottom:18px;line-height:1.5;"></div>
      <a href="/register" class="btn-auth-submit" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">
        Daftar Ulang
      </a>
      <a href="/login" class="auth-ghost-btn">
        Masuk Akun yang Ada
      </a>
    </div>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';

  const stateLoading = document.getElementById('state-loading');
  const stateValid = document.getElementById('state-valid');
  const stateError = document.getElementById('state-error');
  const errorMsg = document.getElementById('error-message');
  const userName = document.getElementById('user-name');
  const userEmail = document.getElementById('user-email');
  const btnConfirm = document.getElementById('btn-confirm');

  if (!token) {
    showError('Token verifikasi tidak ditemukan di tautan.');
    return;
  }

  function showError(msg) {
    stateLoading.style.display = 'none';
    stateValid.style.display = 'none';
    stateError.style.display = 'block';
    errorMsg.textContent = msg;
  }

  fetch('/api/auth/verify-info?token=' + encodeURIComponent(token))
    .then(r => r.json())
    .then(data => {
      stateLoading.style.display = 'none';
      if (!data.ok) {
        showError(data.message || 'Link verifikasi tidak valid atau sudah kadaluarsa.');
        return;
      }
      if (data.already_active) {
        location.href = '/login?verified=1';
        return;
      }
      userName.textContent = data.username;
      userEmail.textContent = data.email;
      stateValid.style.display = 'block';
    })
    .catch(() => {
      showError('Gagal memeriksa data verifikasi. Coba muat ulang halaman.');
    });

  btnConfirm.addEventListener('click', async () => {
    btnConfirm.disabled = true;
    btnConfirm.textContent = 'Memverifikasi...';
    try {
      const res = await fetch('/api/auth/verify-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        location.href = data.redirect || '/register/success';
      } else {
        showError(data.message || 'Gagal memverifikasi akun.');
      }
    } catch {
      showError('Gagal terhubung ke server saat memverifikasi.');
    }
  });
})();
</script>
</body>
</html>
