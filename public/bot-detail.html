<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Statistik Bot — qwertygate</title>
<!-- @include head.html -->
</head>
<body class="page-bot">

<header class="topbar">
  <a href="/dashboard" class="back-link" aria-label="Kembali ke dashboard">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5m7-7-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </a>
  <div class="ttl">
    <span id="hdr-icon"></span>
    <h1 id="hdr-name">Statistik</h1>
    <div class="st"><span class="dot" id="hdr-dot"></span><span id="hdr-status">—</span></div>
  </div>
  <div class="top-actions">
    <a class="btn btn-outline" id="btn-config">Config Bot</a>
    <button class="theme-btn" data-act="toggleTheme" aria-label="Ganti tema" title="Ganti tema">
      <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <div class="stats-wrap" style="width:100%">

    <div class="stats" id="stats-cards">
      <div class="stat"><span class="k">Command Dipakai</span><b id="st-cmd">—</b><small>total, sejak bot dibuat</small></div>
      <div class="stat"><span class="k">User Aktif</span><b id="st-usr">—</b><small>nomor unik yang pernah nge-command</small></div>
      <div class="stat"><span class="k">Command Error</span><b id="st-err">—</b><small>gagal / dibatalkan</small></div>
      <div class="stat"><span class="k">Hits Limit</span><b id="st-lim">—</b><small>kena limit harian</small></div>
    </div>

    <div class="two">
      <div class="panel">
        <h2>Command Paling Sering</h2>
        <table class="tbl" id="tbl-cmd">
          <thead><tr><th>#</th><th>Command</th><th style="text-align:right">Dipakai</th></tr></thead>
          <tbody><tr><td colspan="3" class="muted">Memuat…</td></tr></tbody>
        </table>
      </div>

      <div class="panel">
        <h2>User Paling Aktif</h2>
        <table class="tbl" id="tbl-usr">
          <thead><tr><th>#</th><th>User</th><th>Grup</th><th style="text-align:right">Aktivitas</th><th style="text-align:right">Terakhir</th></tr></thead>
          <tbody><tr><td colspan="5" class="muted">Memuat…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>Aktivitas Harian</h2>
      <div class="chart" id="chart"></div>
    </div>
  </div>
</div>

<script src="/js/bot-stats.js" defer></script>
</body>
</html>
