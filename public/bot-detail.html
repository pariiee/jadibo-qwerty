<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Statistik Bot — qwertygate</title>
<!-- @include head.html -->
<style>
/* Scoped styling khusus statistik bot (/bot/:id) agar rapi, simetris, dan kontras tinggi */
:root {
  --inner-bg: rgba(0,0,0,.18);
  --th-bg: #12141c;
}
:root[data-theme="light"] {
  --bg3: #f0f3fa;
  --shell: rgba(255,255,255,.8);
  --panel: rgba(255,255,255,.9);
  --card: #ffffff;
  --edge: rgba(0,0,0,.08);
  --hl: inset 0 1px 0 rgba(255,255,255,1);
  --ink: #0f172a;
  --mute: #475569;
  --line: rgba(0,0,0,.06);
  --inner-bg: rgba(241,245,249,.8);
  --th-bg: #f8fafc;
  --green: #16a34a;
  --shadow: 0 4px 20px rgba(0,0,0,.05);
}

html {
  overflow-y: auto !important;
  height: auto !important;
}

body.page-bot-stats {
  margin: 0 !important;
  height: auto !important;
  min-height: 100vh !important;
  padding: 24px 20px 48px !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
}

body.page-bot-stats .topbar {
  width: 100% !important;
  max-width: 1200px !important;
  margin: 0 auto 20px !important;
  padding: 14px 24px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 16px !important;
  height: auto !important;
  min-height: 64px !important;
  background: var(--shell) !important;
  border: 1px solid var(--edge) !important;
  border-radius: 24px !important;
  backdrop-filter: blur(28px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
  box-shadow: var(--shadow), var(--hl) !important;
  box-sizing: border-box !important;
}

body.page-bot-stats .back-link {
  width: 38px !important;
  height: 38px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  border-radius: 12px !important;
  background: var(--card) !important;
  border: 1px solid var(--edge) !important;
  color: var(--ink) !important;
  flex-shrink: 0 !important;
  text-decoration: none !important;
  transition: all .2s cubic-bezier(.16,1,.3,1) !important;
}
body.page-bot-stats .back-link:hover {
  background: var(--panel) !important;
  transform: translateX(-2px) !important;
}

body.page-bot-stats .ttl {
  display: flex !important;
  align-items: center !important;
  gap: 12px !important;
  flex: 1 1 auto !important;
  min-width: 0 !important;
}
body.page-bot-stats .ttl #hdr-icon {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  flex-shrink: 0 !important;
}
body.page-bot-stats .ttl h1 {
  font-size: 18px !important;
  font-weight: 700 !important;
  color: var(--ink) !important;
  margin: 0 !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}
body.page-bot-stats .st {
  display: inline-flex !important;
  align-items: center !important;
  gap: 7px !important;
  padding: 4px 12px !important;
  border-radius: 999px !important;
  background: var(--card) !important;
  border: 1px solid var(--edge) !important;
  font-size: 12px !important;
  font-weight: 600 !important;
  color: var(--ink) !important;
  flex-shrink: 0 !important;
}
body.page-bot-stats .dot {
  width: 8px !important;
  height: 8px !important;
  border-radius: 50% !important;
  background: #ef4444 !important;
  flex-shrink: 0 !important;
}
body.page-bot-stats .dot.on {
  background: var(--green) !important;
  box-shadow: 0 0 10px rgba(52,211,153,.5) !important;
}
body.page-bot-stats .dot.wait {
  background: #f59e0b !important;
  box-shadow: 0 0 10px rgba(245,158,11,.5) !important;
}

body.page-bot-stats .top-actions {
  display: flex !important;
  align-items: center !important;
  gap: 10px !important;
  flex-shrink: 0 !important;
}
body.page-bot-stats .top-actions .btn {
  display: inline-flex !important;
  align-items: center !important;
  gap: 8px !important;
  padding: 8px 16px !important;
  border-radius: 12px !important;
  font-size: 13px !important;
  font-weight: 600 !important;
  background: var(--card) !important;
  border: 1px solid var(--edge) !important;
  color: var(--ink) !important;
  text-decoration: none !important;
  cursor: pointer !important;
  transition: all .2s ease !important;
}
body.page-bot-stats .top-actions .btn:hover {
  background: var(--panel) !important;
}

body.page-bot-stats .theme-btn {
  width: 38px !important;
  height: 38px !important;
  border-radius: 12px !important;
  background: var(--card) !important;
  border: 1px solid var(--edge) !important;
  color: var(--ink) !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  cursor: pointer !important;
  transition: all .2s ease !important;
}
body.page-bot-stats .theme-btn:hover {
  background: var(--panel) !important;
}

body.page-bot-stats .layout {
  width: 100% !important;
  max-width: 1200px !important;
  margin: 0 auto !important;
  display: block !important;
  border: none !important;
  background: transparent !important;
  box-shadow: none !important;
  padding: 0 !important;
}
body.page-bot-stats .stats-wrap {
  width: 100% !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 20px !important;
}

body.page-bot-stats .stats {
  display: grid !important;
  grid-template-columns: repeat(4, 1fr) !important;
  gap: 16px !important;
  width: 100% !important;
  margin: 0 !important;
}
@media (max-width: 960px) {
  body.page-bot-stats .stats { grid-template-columns: repeat(2, 1fr) !important; }
}
@media (max-width: 520px) {
  body.page-bot-stats .stats { grid-template-columns: 1fr !important; }
}

body.page-bot-stats .stat {
  background: var(--card) !important;
  border: 1px solid var(--edge) !important;
  border-radius: 20px !important;
  padding: 20px 22px !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 6px !important;
  backdrop-filter: blur(24px) !important;
  -webkit-backdrop-filter: blur(24px) !important;
  box-shadow: var(--shadow), var(--hl) !important;
  transition: transform .2s ease, border-color .2s ease !important;
}
body.page-bot-stats .stat:hover {
  transform: translateY(-2px) !important;
}
body.page-bot-stats .stat .k {
  font-size: 11px !important;
  font-weight: 700 !important;
  letter-spacing: .08em !important;
  text-transform: uppercase !important;
  color: var(--mute) !important;
}
body.page-bot-stats .stat b {
  font-size: 32px !important;
  font-weight: 800 !important;
  color: var(--ink) !important;
  font-variant-numeric: tabular-nums !important;
  line-height: 1.1 !important;
  margin: 2px 0 !important;
}
body.page-bot-stats .stat small {
  font-size: 12px !important;
  color: var(--mute) !important;
  line-height: 1.4 !important;
}

body.page-bot-stats .two {
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  gap: 20px !important;
  width: 100% !important;
}
@media (max-width: 960px) {
  body.page-bot-stats .two { grid-template-columns: 1fr !important; }
}

body.page-bot-stats .panel {
  background: var(--panel) !important;
  border: 1px solid var(--edge) !important;
  border-radius: 24px !important;
  padding: 24px !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 16px !important;
  backdrop-filter: blur(28px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
  box-shadow: var(--shadow), var(--hl) !important;
  overflow: hidden !important;
}
body.page-bot-stats .panel h2 {
  font-size: 16px !important;
  font-weight: 700 !important;
  color: var(--ink) !important;
  margin: 0 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  white-space: nowrap !important;
}

body.page-bot-stats .tbl-wrap {
  overflow-x: auto !important;
  overflow-y: auto !important;
  max-height: 380px !important;
  border-radius: 16px !important;
  border: 1px solid var(--line) !important;
  background: var(--inner-bg) !important;
}
body.page-bot-stats .tbl {
  width: 100% !important;
  border-collapse: collapse !important;
  font-size: 13px !important;
  text-align: left !important;
}
body.page-bot-stats .tbl th {
  position: sticky !important;
  top: 0 !important;
  background: var(--th-bg) !important;
  z-index: 2 !important;
  padding: 12px 16px !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  letter-spacing: .08em !important;
  text-transform: uppercase !important;
  color: var(--mute) !important;
  border-bottom: 1px solid var(--edge) !important;
  white-space: nowrap !important;
}
body.page-bot-stats .tbl td {
  padding: 12px 16px !important;
  border-bottom: 1px solid var(--line) !important;
  color: var(--ink) !important;
  vertical-align: middle !important;
  font-size: 13px !important;
}
body.page-bot-stats .tbl tr:last-child td {
  border-bottom: none !important;
}
body.page-bot-stats .tbl tbody tr:hover {
  background: rgba(255,255,255,.03) !important;
}
:root[data-theme="light"] body.page-bot-stats .tbl tbody tr:hover {
  background: rgba(0,0,0,.02) !important;
}
body.page-bot-stats .tbl code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
  background: rgba(99,102,241,.12) !important;
  color: #818cf8 !important;
  border: 1px solid rgba(99,102,241,.24) !important;
  padding: 3px 8px !important;
  border-radius: 6px !important;
  font-size: 12.5px !important;
  font-weight: 600 !important;
}
:root[data-theme="light"] body.page-bot-stats .tbl code {
  color: #4f46e5 !important;
}
body.page-bot-stats .muted {
  color: var(--mute) !important;
}

body.page-bot-stats .chart {
  display: flex !important;
  align-items: flex-end !important;
  gap: 12px !important;
  height: 180px !important;
  padding: 20px 14px 14px !important;
  overflow-x: auto !important;
  border-radius: 16px !important;
  background: var(--inner-bg) !important;
  border: 1px solid var(--line) !important;
  box-sizing: border-box !important;
}
body.page-bot-stats .bar {
  flex: 1 0 42px !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: flex-end !important;
  align-items: center !important;
  height: 100% !important;
  gap: 8px !important;
  min-width: 0 !important;
  transition: transform .15s ease !important;
}
body.page-bot-stats .bar:hover {
  transform: scaleY(1.02) !important;
}
body.page-bot-stats .bar .fill {
  width: 100% !important;
  max-width: 36px !important;
  min-height: 4px !important;
  border-radius: 8px 8px 3px 3px !important;
  background: linear-gradient(180deg, #6366f1, #3b82f6) !important;
  box-shadow: 0 4px 12px rgba(99,102,241,.25) !important;
  transition: height .3s cubic-bezier(.16,1,.3,1) !important;
}
body.page-bot-stats .bar span {
  font-size: 11px !important;
  color: var(--mute) !important;
  font-weight: 700 !important;
  white-space: nowrap !important;
}
</style>
</head>
<body class="page-bot page-bot-stats">

<header class="topbar">
  <a href="/dashboard" class="back-link" aria-label="Kembali ke dashboard">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5m7-7-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </a>
  <div class="ttl">
    <span id="hdr-icon"></span>
    <h1 id="hdr-name">Statistik</h1>
    <div class="st"><span class="dot" id="hdr-dot"></span><span id="hdr-status">—</span></div>
  </div>
  <div class="top-actions">
    <a class="btn btn-outline" id="btn-config">Config Bot</a>
    <button class="theme-btn" data-act="toggleTheme" aria-label="Ganti tema" title="Ganti tema">
      <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <div class="stats-wrap">

    <div class="stats" id="stats-cards">
      <div class="stat"><span class="k">Command Dipakai</span><b id="st-cmd">—</b><small>total, sejak bot dibuat</small></div>
      <div class="stat"><span class="k">User Aktif</span><b id="st-usr">—</b><small>nomor unik yang pernah nge-command</small></div>
      <div class="stat"><span class="k">Command Error</span><b id="st-err">—</b><small>gagal / dibatalkan</small></div>
      <div class="stat"><span class="k">Hits Limit</span><b id="st-lim">—</b><small>kena limit harian</small></div>
    </div>

    <div class="two">
      <div class="panel">
        <h2>Command Paling Sering</h2>
        <div class="tbl-wrap">
          <table class="tbl" id="tbl-cmd">
            <thead><tr><th>#</th><th>Command</th><th style="text-align:right">Dipakai</th></tr></thead>
            <tbody><tr><td colspan="3" class="muted">Memuat…</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h2>User Paling Aktif</h2>
        <div class="tbl-wrap">
          <table class="tbl" id="tbl-usr">
            <thead><tr><th>#</th><th>User</th><th>Grup</th><th style="text-align:right">Aktivitas</th><th style="text-align:right">Terakhir</th></tr></thead>
            <tbody><tr><td colspan="5" class="muted">Memuat…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Aktivitas Harian</h2>
      <div class="chart" id="chart"></div>
    </div>
  </div>
</div>

<script src="/js/bot-stats.js" defer></script>
</body>
</html>
