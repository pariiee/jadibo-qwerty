<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{CODE}} — {{TITLE}} | qwertygate</title>
<!-- @include head.html -->
<style>
  html, body.page-error {
    height: 100% !important;
    min-height: 100vh !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    background-color: #FAFAFA !important;
    background-image: radial-gradient(#151515 1px, transparent 1px) !important;
    background-size: 24px 24px !important;
    font-family: 'Plus Jakarta Sans', sans-serif !important;
    padding: 20px !important;
    margin: 0 !important;
    box-sizing: border-box !important;
  }
  .err-card {
    width: 100% !important;
    max-width: 420px !important;
    height: auto !important;
    min-height: auto !important;
    max-height: fit-content !important;
    background: #FFFFFF !important;
    border: 2.5px solid #151515 !important;
    border-radius: 28px !important;
    box-shadow: 6px 6px 0px #151515 !important;
    padding: 36px 28px !important;
    text-align: center !important;
    box-sizing: border-box !important;
    margin: auto !important;
    position: relative !important;
  }
  .err-brand {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: #D8FF7A;
    border: 2px solid #151515;
    box-shadow: 3px 3px 0px #151515;
    margin-bottom: 20px;
  }
  .err-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 999px;
    background: #FFE4E6;
    color: #BE123C;
    border: 2px solid #151515;
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: .04em;
    margin-bottom: 14px;
    box-shadow: 2px 2px 0px #151515;
  }
  .err-title {
    font-size: 22px;
    font-weight: 800;
    color: #151515;
    letter-spacing: -.03em;
    margin: 0 0 10px;
  }
  .err-desc {
    font-size: 13.5px;
    color: #52525B;
    line-height: 1.55;
    font-weight: 500;
    margin: 0 0 28px;
  }
  .err-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .err-btn {
    height: 46px;
    border-radius: 14px;
    font-size: 13.5px;
    font-weight: 800;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .15s ease;
    box-sizing: border-box;
  }
  .err-btn-sec {
    background: #FFFFFF;
    color: #151515;
    border: 2px solid #151515;
    box-shadow: 3px 3px 0px #151515;
  }
  .err-btn-pri {
    background: #151515;
    color: #FFFFFF;
    border: 2px solid #151515;
    box-shadow: 3px 3px 0px #7A63F0;
  }
  .err-btn:hover {
    transform: translate(-1px, -1px);
  }
  .err-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0px #151515;
  }
  @media (max-width: 480px) {
    .err-card { padding: 28px 20px !important; }
    .err-btns { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="page-error">

<div class="err-card" role="alert">
  <div class="err-brand">
    <img src="/assets/parigate.svg" alt="qwertygate" width="38" height="38" />
  </div>
  <div><span class="err-badge">ERROR {{CODE}}</span></div>
  <h1 class="err-title">{{TITLE}}</h1>
  <p class="err-desc">{{MESSAGE}}</p>
  <div class="err-btns">
    <button type="button" class="err-btn err-btn-sec" onclick="history.length>1?history.back():location.href='/'">Kembali</button>
    <a class="err-btn err-btn-pri" href="{{PRIMARY_HREF}}">{{PRIMARY_LABEL}}</a>
  </div>
</div>

</body>
</html>
