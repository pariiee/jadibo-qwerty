<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Akun Berhasil Dibuat — Yapari Bots</title>
<!-- @include head.html -->
</head>
<body class="page-auth">

<button class="theme-btn theme-btn-auth" data-act="toggleTheme" aria-label="Ganti tema" title="Ganti tema">
  <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<div class="auth-wrap">
  <div class="modal auth-card" style="text-align:center;">
    <div class="auth-page-icon ic-success">
      <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h2>Akun berhasil dibuat!</h2>
    <p class="auth-desc" style="margin-bottom:16px;">Selamat datang di Yapari Bots.</p>

    <div class="auth-info-box">
      <div style="font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;">Login sebagai</div>
      <div class="auth-info-name" id="succ-username" style="font-size:16px;font-weight:700;">Pengguna</div>
      <div class="auth-info-email" id="succ-email" style="font-size:13px;color:var(--mute);margin-top:2px;"></div>
    </div>

    <p class="auth-page-desc">
      Email kamu sudah terverifikasi. Akun aktif dan siap digunakan.
    </p>

    <a href="/dashboard" class="btn-auth-submit" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">
      Pergi ke Dashboard →
    </a>
  </div>
</div>

<script>
(() => {
  fetch('/api/auth/me')
    .then(r => r.json())
    .then(data => {
      if (data && data.user) {
        document.getElementById('succ-username').textContent = data.user.username || 'Pengguna';
        if (data.user.email) {
          document.getElementById('succ-email').textContent = data.user.email;
        }
      }
    })
    .catch(() => {});
})();
</script>
</body>
</html>
