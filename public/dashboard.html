<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — qwertygate</title>
<!-- @include head.html -->
<style>
/* Modal Tambah Bot & Grid Dashboard */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;z-index:100;padding:20px}
.overlay.show{display:grid}
.modal{background:var(--card);border:1px solid var(--edge);border-radius:26px;padding:28px;max-width:460px;width:100%;box-shadow:var(--shadow);position:relative}
.modal h3{margin:0 0 6px;font-size:20px}
.modal-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);background:var(--card);display:grid;place-items:center;cursor:pointer}
.m-sub{margin:0 0 20px;color:var(--mute);font-size:13px}
.plat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plat-btn{padding:18px;border-radius:18px;border:1px solid var(--edge);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.plat-btn:hover{background:var(--dark);color:var(--darkink)}
.plat-btn.sel{border-color:var(--acc);background:rgba(37,99,235,.08)}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:600}
.field input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--edge);background:var(--card);color:var(--ink);font:inherit}
.field .hint{font-size:11.5px;color:var(--mute);margin-top:4px}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--edge);background:var(--card);display:grid;place-items:center;cursor:pointer}
.submit-btn{width:100%;padding:12px;border-radius:999px;border:0;background:var(--dark);color:var(--darkink);font-weight:700;cursor:pointer;margin-top:10px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:14px 0 24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--dark);color:var(--darkink);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body class="page-dashboard">
<div class="app">
  <!-- @include sidebar.html -->

  <main>
    <!-- @include topbar.html -->

    <div class="content">
      <div id="kuota-alert" style="display:none"></div>
      <div id="pengumuman" style="display:none"><strong id="peng-judul"></strong><p id="peng-isi"></p></div>
      <h1 id="greeting" style="display:none"></h1>
      <div class="empty" id="empty-state" style="display:none"></div>
      <section class="hero">
        <h1 id="hero-greeting"><span class="hero-sub" style="font-size:14px;display:block;margin-bottom:4px">Selamat Datang Kembali,</span><span class="hero-user" id="hero-name"></span></h1>
      </section>

      <section class="stats">
        <div class="stat"><div class="sic"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 4-8 4-8-4 8-4zM4 12l8 4 8-4M4 17l8 4 8-4"/></svg></div><span class="lbl">Status Slot</span><div class="val" id="st-role">—</div><div class="sub" id="st-role-sub">Kapasitas slot bot</div></div>
        <div class="stat"><div class="sic"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div><span class="lbl">Kedaluwarsa</span><div class="val" id="st-exp">Tidak ada</div><div class="sub" id="st-exp-sub">Masa aktif langganan</div></div>
        <div class="stat"><div class="sic"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><span class="lbl">Bot Online</span><div class="val" id="st-online">0</div><div class="sub" id="st-online-sub">dari 0 bot kamu</div></div>
        <div class="stat"><div class="sic"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h18v10H3zM3 11h18"/></svg></div><span class="lbl">Slot Dibeli</span><div class="val" id="st-slot">0</div><div class="sub" id="st-slot-sub">Kapasitas slot akun</div></div>
      </section>

      <h2 style="font-size:18px;margin:32px 0 16px;display:flex;align-items:baseline;gap:10px">Slot bot kamu <small id="slot-text" style="color:var(--mute);font-weight:500;font-size:14px">0 / 0</small></h2>
      <div class="grid" id="bot-grid"></div>
    </div>
  </main>
</div>

<!-- Add Bot Modal -->
<div class="overlay" id="add-overlay">
  <div class="modal">
    <button class="modal-close" data-act="closeAdd" aria-label="Tutup"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div id="step-platform">
      <h3>Tambah Bot Baru</h3>
      <p class="m-sub">Pilih platform bot kamu</p>
      <div class="plat-grid">
        <button class="plat-btn" id="plat-wa" data-act="pickPlatform('whatsapp')" type="button">
          <svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l5.09-1.34A9.95 9.95 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z" fill="#25D366"/><path d="M17 14.8c-.3-.15-1.77-.87-2.05-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.81c-.2 0-.52.07-.79.37s-.61 1-.61 1.97.74 2.12.84 2.27c.1.15 1.46 2.22 3.53 3.12.49.21.88.34 1.18.44.5.16.95.14 1.3.08.4-.06 1.22-.5 1.4-.98.17-.48.17-.9.12-1-.05-.1-.2-.15-.5-.3z" fill="#fff"/></svg>
          <span>WhatsApp</span>
        </button>
        <button class="plat-btn" id="plat-tg" data-act="pickPlatform('telegram')" type="button">
          <svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#229ED9"/><path d="M17.5 7.5 14.7 16.7c-.2.6-.8.8-1.3.5l-2.5-1.9-1.2 1.1c-.1.1-.3.2-.5.2l.2-2.7 5.2-4.7c.2-.2 0-.3-.3-.1L7.2 12.9 4.8 12c-.6-.2-.6-.6.1-.9l12-4.6c.5-.2.9.1.6.1z" fill="#fff"/></svg>
          <span>Telegram</span>
        </button>
      </div>
    </div>
    <div id="step-form" style="display:none">
      <div class="back-row">
        <button class="back-btn" data-act="backStep" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button>
        <h3 id="form-badge">Konfigurasi Bot</h3>
      </div>
      <form id="add-form">
        <div class="field"><label for="f-name">Nama Bot *</label><input id="f-name" required placeholder="Contoh: Bot Saya"></div>
        <div class="field" id="wrap-botnum"><label id="lbl-owner" for="f-botnum">Nomor Bot WA</label><input id="f-botnum" placeholder="628xxxxxxxxxx"><div class="hint" id="hint-owner">Nomor yang di-pair ke bot</div></div>
        <div class="field" id="wrap-token" style="display:none"><label for="f-token">Token Telegram Bot *</label><input id="f-token" placeholder="123456:ABC-DEF..." type="password"></div>
        <div class="field"><label for="f-owner">Nomor Owner</label><input id="f-owner" placeholder="628xxxxxxxxxx"></div>
        <div class="field"><label for="f-prefix">Prefix</label><input id="f-prefix" value="." maxlength="3"></div>
        <input id="f-footer" type="hidden" value="Powered by qwertygate">
        <div id="add-error" style="color:#ef4444;font-size:12.5px;margin-bottom:8px"></div>
        <button class="submit-btn" type="submit">Buat Bot Sekarang</button>
      </form>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/js/dashboard.js"></script>
</body>
</html>
