<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — yaparbots</title>
<!-- @include head.html -->
</head>
<body class="page-dashboard">
<div class="app">

  <!-- @include sidebar.html -->

  <main>
    <!-- @include topbar.html -->

    <div class="content">
      <div class="slot-head">
        <div>
          <div class="lbl">Slot Bot Kamu</div>
          <div class="slot-row">
            <span class="slot-dots" id="slot-dots"></span>
            <span class="slot-txt" id="slot-text">0 / 0</span>
          </div>
        </div>
      </div>

      <div class="grid" id="bot-grid"></div>

      <div class="empty" id="empty-state" style="display:none">
        <div class="ic">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h3>Belum ada bot</h3>
        <p>Tambah bot pertama kamu untuk memulai</p>
        <button class="btn btn-dark" data-act="openAddBot">Tambah Bot Sekarang</button>
      </div>
    </div>
  </main>
</div>

<!-- Add bot modal -->
<div class="overlay" id="add-overlay">
  <div class="modal">
    <button class="modal-close" data-act="closeAdd" aria-label="Tutup">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div id="step-platform">
      <h3>Tambah Bot Baru</h3>
      <p class="m-sub">Pilih platform yang ingin kamu gunakan</p>
      <div class="plat-grid">
        <button class="plat-btn" id="plat-wa" data-act="pickPlatform('whatsapp')">
          <svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l5.09-1.34A9.95 9.95 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z" fill="#25D366"/><path d="M17 14.8c-.3-.15-1.77-.87-2.05-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.81c-.2 0-.52.07-.79.37s-.61 1-.61 1.97.74 2.12.84 2.27c.1.15 1.46 2.22 3.53 3.12.49.21.88.34 1.18.44.5.16.95.14 1.3.08.4-.06 1.22-.5 1.4-.98.17-.48.17-.9.12-1-.05-.1-.2-.15-.5-.3z" fill="#fff"/></svg>
          <span>WhatsApp</span>
        </button>
        <button class="plat-btn" id="plat-tg" data-act="pickPlatform('telegram')">
          <svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#229ED9"/><path d="M17.5 7.5 14.7 16.7c-.2.6-.8.8-1.3.5l-2.5-1.9-1.2 1.1c-.1.1-.3.2-.5.2l.2-2.7 5.2-4.7c.2-.2 0-.3-.3-.1L7.2 12.9 4.8 12c-.6-.2-.6-.6.1-.9l12-4.6c.5-.2.9.1.6.1z" fill="#fff"/></svg>
          <span>Telegram</span>
        </button>
      </div>
    </div>

    <div id="step-form" style="display:none">
      <div class="back-row">
        <button class="back-btn" data-act="backStep" aria-label="Kembali">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5m7-7-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h3>Konfigurasi Bot <span id="form-badge" style="font-weight:400;font-size:13px;color:var(--muted);text-transform:capitalize"></span></h3>
      </div>
      <form id="add-form">
        <div class="field">
          <label for="f-name">Nama Bot <span class="req">*</span></label>
          <input class="inp" id="f-name" type="text" placeholder="Contoh: Bot Grup Seru" required />
        </div>
        <div class="field">
          <label id="lbl-owner" for="f-owner">Nomor Owner</label>
          <input class="inp" id="f-owner" type="text" placeholder="628xxxxxxxxxx" />
          <div class="hint" id="hint-owner">Nomor pemilik bot — untuk akses command owner-only</div>
        </div>
        <div class="field" id="wrap-botnum">
          <label for="f-botnum">Nomor Bot WA</label>
          <input class="inp" id="f-botnum" type="text" placeholder="628xxxxxxxxxx" />
          <div class="hint">Nomor WA yang akan di-pair ke bot ini</div>
        </div>
        <div class="field" id="wrap-token" style="display:none">
          <label for="f-token">Token Telegram Bot <span class="req">*</span></label>
          <input class="inp" id="f-token" type="password" placeholder="123456:ABC-DEF..." autocomplete="off" />
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-prefix">Prefix</label>
            <input class="inp" id="f-prefix" type="text" value="!" maxlength="3" />
          </div>
          <div class="field">
            <label for="f-footer">Footer</label>
            <input class="inp" id="f-footer" type="text" placeholder="Powered by yaparbots" />
          </div>
        </div>
        <div class="err" id="add-error"></div>
        <button class="btn btn-dark submit" type="submit">Buat Bot</button>
      </form>
    </div>
  </div>
</div>

<script src="/js/dashboard.js" defer></script>
</body>
</html>
