<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cek Email Kamu — Yapari Bots</title>
<!-- @include head.html -->
</head>
<body class="page-auth">

<button class="theme-btn theme-btn-auth" data-act="toggleTheme" aria-label="Ganti tema" title="Ganti tema">
  <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<div class="auth-wrap">
  <div class="modal auth-card" style="text-align:center;">
    <div class="auth-page-icon">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </div>
    <h2>Cek email kamu</h2>
    <p class="auth-desc" style="margin-bottom:16px;">Kami kirim link verifikasi ke inbox kamu.</p>

    <div class="auth-info-box" id="box-email" style="display:none;">
      <div class="auth-info-row">
        <div class="auth-info-avatar">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <div style="min-width:0;flex:1;">
          <div class="auth-info-name" style="font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;">Tujuan Verifikasi</div>
          <div class="auth-info-email" id="pending-email" style="font-size:14px;font-weight:700;color:var(--ink);word-break:break-all;"></div>
        </div>
      </div>
    </div>

    <div id="resend-status" style="display:none;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:14px;line-height:1.45;"></div>

    <p class="auth-page-desc">
      Klik link di email untuk verifikasi dan aktivasi akun kamu. Akun <strong>belum aktif</strong> sampai kamu klik tautan tersebut.
    </p>

    <button type="button" class="btn-auth-submit" id="btn-resend">
      Kirim ulang email verifikasi
    </button>

    <a href="/register" class="auth-ghost-btn">
      Kembali ke halaman daftar
    </a>
  </div>
</div>

<script>
(() => {
  const boxEmail = document.getElementById('box-email');
  const elEmail = document.getElementById('pending-email');
  const btnResend = document.getElementById('btn-resend');
  const statusEl = document.getElementById('resend-status');

  // Ambil email dari cookie session yang aman (anti-tampering attacker via query string)
  fetch('/api/auth/pending-info')
    .then(r => r.json())
    .then(data => {
      if (!data.ok || !data.email) {
        location.href = '/register';
        return;
      }
      elEmail.textContent = data.email;
      boxEmail.style.display = 'block';
    })
    .catch(() => {
      location.href = '/register';
    });

  btnResend.addEventListener('click', async () => {
    btnResend.disabled = true;
    btnResend.textContent = 'Mengirim...';
    statusEl.style.display = 'none';

    try {
      const res = await fetch('/api/auth/resend-verification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await res.json();
      if (res.ok) {
        statusEl.style.background = 'rgba(16,185,129,.1)';
        statusEl.style.border = '1px solid rgba(16,185,129,.25)';
        statusEl.style.color = 'var(--green, #10b981)';
        statusEl.textContent = data.message || 'Email verifikasi baru sudah dikirim ke inbox kamu.';
        statusEl.style.display = 'block';
        btnResend.textContent = 'Email Terkirim';
        setTimeout(() => {
          btnResend.disabled = false;
          btnResend.textContent = 'Kirim ulang email verifikasi';
        }, 15000);
      } else {
        statusEl.style.background = 'rgba(239,68,68,.1)';
        statusEl.style.border = '1px solid rgba(239,68,68,.25)';
        statusEl.style.color = 'var(--red, #ef4444)';
        statusEl.textContent = data.message || 'Gagal mengirim ulang email.';
        statusEl.style.display = 'block';
        btnResend.disabled = false;
        btnResend.textContent = 'Kirim ulang email verifikasi';
      }
    } catch {
      statusEl.style.background = 'rgba(239,68,68,.1)';
      statusEl.style.border = '1px solid rgba(239,68,68,.25)';
      statusEl.style.color = 'var(--red, #ef4444)';
      statusEl.textContent = 'Gagal terhubung ke server.';
      statusEl.style.display = 'block';
      btnResend.disabled = false;
      btnResend.textContent = 'Kirim ulang email verifikasi';
    }
  });
})();
</script>
</body>
</html>
