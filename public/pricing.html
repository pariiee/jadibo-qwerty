<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pricing & Paket — qwertygate</title>
<!-- @include head.html -->
</head>
<body class="page-dashboard page-pricing">
<div class="app">

  <main>
    <!-- @include topbar.html -->

    <div class="content pricing-bento-content">
      <!-- Hero Banner Bento -->
      <section class="pricing-hero-banner">
        <div class="pricing-hero-left">
          <span class="pricing-hero-chip">PAKET & LANGGANAN</span>
          <h2>Pilihan Paket Bot</h2>
          <p>Tingkatkan kapasitas bot kamu. Dapatkan tambahan slot, kuota pesan lebih melimpah, dan masa aktif hingga 30 hari.</p>
        </div>
      </section>

      <!-- Hidden guards untuk backward-compatibility cache browser lama -->
      <span id="plan-badge" style="display:none"></span>
      <span id="plan-until" style="display:none"></span>
      <span id="trial-note" style="display:none"></span>
      <button id="btn-trial" style="display:none" type="button"></button>

      <!-- Grid Daftar Paket -->
      <div class="plan-wrap">
        <div class="grid plan-grid" id="plan-grid"></div>
      </div>
    </div>
  </main>
</div>

<!-- Modal Checkout Pembayaran -->
<div class="overlay" id="bayar-overlay">
  <div class="modal pricing-modal">
    <button class="modal-close" data-act="closeBayar" aria-label="Tutup" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>

    <div id="step-metode">
      <span class="pricing-modal-chip">METODE PEMBAYARAN</span>
      <h3 id="bayar-judul" class="pricing-modal-title">Pilih Paket</h3>
      <p class="pricing-modal-sub" id="bayar-harga"></p>
      <div class="plat-grid pricing-plat-grid">
        <button class="plat-btn pricing-plat-btn" data-act="pilihMetode('gateway')" type="button">
          <div class="plat-ic-box" style="background:#D8FF7A">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" stroke="#151515" stroke-width="2.2" stroke-linejoin="round"/></svg>
          </div>
          <div class="plat-txt-box">
            <span class="plat-txt-title">QRIS Otomatis</span>
            <small class="plat-txt-desc">Proses instan, aktif otomatis tanpa tunggu admin</small>
          </div>
        </button>
        <button class="plat-btn pricing-plat-btn" data-act="pilihMetode('manual')" type="button">
          <div class="plat-ic-box" style="background:#BFD7FF">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" stroke="#151515" stroke-width="2"/><rect x="14" y="3" width="7" height="7" stroke="#151515" stroke-width="2"/><rect x="3" y="14" width="7" height="7" stroke="#151515" stroke-width="2"/><path d="M14 14h3v3h-3zM19 19h2v2h-2z" fill="#151515"/></svg>
          </div>
          <div class="plat-txt-box">
            <span class="plat-txt-title">QRIS Manual</span>
            <small class="plat-txt-desc">Scan QRIS statis, verifikasi cepat oleh admin</small>
          </div>
        </button>
      </div>
    </div>

    <div id="step-bayar" style="display:none">
      <span class="pricing-modal-chip">SELESAIKAN PEMBAYARAN</span>
      <h3 id="bayar-judul2" class="pricing-modal-title">Selesaikan Pembayaran</h3>
      <p class="pricing-modal-sub" id="bayar-kode"></p>
      <div class="pricing-qr-wrap"><img id="bayar-qr" alt="QRIS" /></div>
      <p class="pricing-modal-sub" id="bayar-info"></p>
      <div class="bayar-actions pricing-modal-actions">
        <a id="bayar-tautan" class="pricing-btn-primary" href="#" target="_blank" rel="noopener" style="display:none">Buka Halaman Bayar</a>
        <button class="pricing-btn-secondary" id="btn-cek" data-act="cekStatus" type="button">Cek Status Pembayaran</button>
      </div>
    </div>
  </div>
</div>

<script>
  window.__CSRF__ = null;
</script>
<script src="/js/pricing.js?v=5.1" defer></script>
</body>
</html>
