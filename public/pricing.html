<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pricing — qwertygate</title>
<!-- @include head.html -->
</head>
<body class="page-pricing">
<div class="app">

  <!-- @include sidebar.html -->

  <main>
    <!-- @include topbar.html -->

    <div class="content">
      <header class="cmd-head">
        <div>
          <h2>Pricing</h2>
          <p class="m-sub">Pilih paket untuk menambah slot bot dan kuota.</p>
        </div>
      </header>

      <!-- Status slot -->
      <section class="slot-head card">
        <div>
          <div class="lbl">Status slot kamu</div>
          <div class="slot-row">
            <span class="plan-badge" id="plan-badge">Memuat…</span>
            <span class="slot-txt" id="plan-until"></span>
          </div>
        </div>
        <button class="btn btn-dark" id="btn-trial" data-act="klaimTrial" style="display:none">Klaim Trial 5 Hari</button>
      </section>

      <div class="note" id="trial-note" style="display:none"></div>

      <div class="plan-wrap">
        <div class="grid plan-grid" id="plan-grid"></div>
      </div>
    </div>
  </main>
</div>

<!-- Pilih cara bayar. Di LUAR <main>: <main> ber-backdrop-filter, dan itu
     membuat position:fixed ikut terkurung di dalam panel (scrim tidak
     menutupi layar). -->
<div class="overlay" id="bayar-overlay">
  <div class="modal">
    <button class="modal-close" data-act="closeBayar" aria-label="Tutup">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div id="step-metode">
      <h3 id="bayar-judul">Pilih paket</h3>
      <p class="m-sub" id="bayar-harga"></p>
      <div class="plat-grid">
        <button class="plat-btn" data-act="pilihMetode('gateway')">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>QRIS Otomatis</span>
          <small>Aktif sendiri, cepat</small>
        </button>
        <button class="plat-btn" data-act="pilihMetode('manual')">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="1.8"/><path d="M14 14h3v3h-3zM19 19h2v2h-2z" fill="currentColor"/></svg>
          <span>QRIS Manual</span>
          <small>Scan sendiri, admin konfirmasi</small>
        </button>
      </div>
    </div>

    <div id="step-bayar" style="display:none">
      <h3 id="bayar-judul2">Selesaikan pembayaran</h3>
      <p class="m-sub" id="bayar-kode"></p>
      <div class="qr-wrap"><img id="bayar-qr" alt="QRIS" /></div>
      <p class="m-sub" id="bayar-info"></p>
      <div class="bayar-actions">
        <a id="bayar-tautan" class="btn btn-dark" href="#" target="_blank" rel="noopener" style="display:none">Buka halaman bayar</a>
        <button class="btn btn-outline" id="btn-cek" data-act="cekStatus">Cek status pembayaran</button>
      </div>
    </div>
  </div>
</div>

<script>
  window.__CSRF__ = null;
</script>
<script src="/js/pricing.js"></script>
</body>
</html>
