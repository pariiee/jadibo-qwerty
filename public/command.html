<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Command Manager — qwertygate</title>
<!-- @include head.html -->
</head>
<body class="page-dashboard page-command">
<div class="app">

  <main>
    <!-- @include topbar.html -->

    <div class="content cmd-bento-content">
      <!-- Hero Banner Command Bento -->
      <section class="cmd-hero-banner">
        <div class="cmd-hero-left">
          <span class="cmd-hero-chip">Katalog Bot</span>
          <h2>Command Manager</h2>
          <p>Daftar lengkap perintah bot untuk WhatsApp, Telegram, dan Discord. Cari command atau klik untuk melihat alias & kegunaannya.</p>
        </div>
        <div class="cmd-hero-stat">
          <span class="cmd-stat-lbl">Total Tersedia</span>
          <b class="cmd-stat-val" id="cmd-hitung-banner">...</b>
        </div>
      </section>

      <!-- Bar Filter & Pencarian -->
      <div class="cmd-toolbar">
        <div class="cmd-search-wrap">
          <svg class="cmd-search-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="cmd-inp" id="cmd-cari" type="search" placeholder="Cari perintah atau alias (misal: .menu, .ai)..." autocomplete="off" />
        </div>
        <select class="cmd-select" id="cmd-kategori">
          <option value="">Semua Kategori</option>
        </select>
        <button class="cmd-btn-reload" data-act="muatCommand" type="button">
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
          <span>Muat Ulang</span>
        </button>
      </div>

      <div class="cmd-info-row">
        <span id="cmd-hitung">Memuat command...</span>
      </div>

      <!-- List Accordion Command -->
      <div class="cmd-list" id="cmd-daftar"></div>

      <!-- State Kosong -->
      <div class="cmd-kosong" id="cmd-kosong" style="display:none">
        <div class="cmd-kosong-ic">🔍</div>
        <b>Tidak ada command yang cocok</b>
        <span>Coba kata kunci lain atau pilih “Semua Kategori”.</span>
      </div>

      <!-- Pagination -->
      <div class="cmd-pager" id="cmd-pager" style="display:none">
        <button class="cmd-pager-btn" data-act="cmdHal(-1)" type="button">‹ Prev</button>
        <span class="cmd-pager-info" id="cmd-hal">Hal 1/1</span>
        <button class="cmd-pager-btn" data-act="cmdHal(1)" type="button">Next ›</button>
      </div>
    </div>
  </main>
</div>

<script src="/js/command.js?v=2.1" defer></script>
</body>
</html>
