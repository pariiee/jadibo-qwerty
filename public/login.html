<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk — parigate</title>
<!-- @include head.html -->
</head>
<body class="page-auth" data-mode="login">

<button class="theme-btn theme-btn-auth" data-act="toggleTheme" aria-label="Ganti tema" title="Ganti tema">
  <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<div class="auth-wrap">
  <!-- PANE LOGIN -->
  <div class="modal auth-card" id="auth-login">
    <div class="auth-brand">
      <img src="/assets/parigate.svg" alt="parigate" class="auth-logo" width="60" height="60" />
    </div>
    <h2>Welcome Back!</h2>
    <p class="auth-desc">Please enter your login details.</p>

    <form id="login-form">
      <div class="field">
        <label for="login-username">Email or Username</label>
        <input class="inp" id="login-username" type="text" placeholder="johnwick123@gmail.com" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <div class="inp-pass-wrap">
          <input class="inp" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="btn-toggle-pass" data-target="login-password" aria-label="Toggle password" title="Toggle password">
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="auth-aux">
        <a href="https://wa.me/6287778032605?text=Halo%20admin%2C%20saya%20lupa%20password%20akun%20parigate" target="_blank" rel="noopener" class="auth-link-sub">Forgot Password?</a>
      </div>
      <div class="err" id="login-error"></div>
      <button class="btn btn-dark btn-auth-submit" type="submit">Login</button>
    </form>

    <div class="auth-divider"><span>OR</span></div>

    <div class="auth-social">
      <button type="button" class="btn-social" onclick="alert('Login Google akan segera hadir!')">
        <svg class="social-ic" width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.87c2.26-2.09 3.675-5.17 3.675-9.15z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3.05c-1.08.72-2.45 1.16-4.06 1.16-3.13 0-5.78-2.11-6.73-4.96H1.27v3.15C3.26 21.36 7.36 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24A7.18 7.18 0 0 1 4.9 12c0-.78.14-1.54.37-2.24V6.61H1.27A11.97 11.97 0 0 0 0 12c0 1.92.45 3.74 1.27 5.39l4-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.27 6.61l4 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
        <span>With Google</span>
      </button>
      <button type="button" class="btn-social" onclick="alert('Login Telegram akan segera hadir!')">
        <svg class="social-ic" width="18" height="18" viewBox="0 0 24 24"><path fill="#0088cc" d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-1.97 9.28c-.15.65-.53.81-1.08.5l-3-2.21-1.45 1.4c-.16.16-.3.3-.61.3l.21-3.05 5.56-5.02c.24-.22-.05-.34-.38-.12L9.4 13.62l-2.96-.92c-.64-.2-.66-.64.13-.95l11.57-4.46c.54-.2 1.01.13.82.87z"/></svg>
        <span>With Telegram</span>
      </button>
    </div>

    <p class="switch-line">Don't have an account? <a href="/register">Register now</a></p>
  </div>

  <!-- PANE REGISTER -->
  <div class="modal auth-card" id="auth-register" style="display:none">
    <div class="auth-brand">
      <img src="/assets/parigate.svg" alt="parigate" class="auth-logo" width="60" height="60" />
    </div>
    <h2>Create an Account</h2>
    <p class="auth-desc">Please enter your details to sign up.</p>

    <form id="register-form">
      <div class="field">
        <label for="reg-username">Username or Email</label>
        <input class="inp" id="reg-username" type="text" placeholder="Pilih username unik" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <div class="inp-pass-wrap">
          <input class="inp" id="reg-password" type="password" placeholder="Min. 6 karakter" autocomplete="new-password" required />
          <button type="button" class="btn-toggle-pass" data-target="reg-password" aria-label="Lihat password" title="Lihat password">
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="err" id="reg-error"></div>
      <button class="btn btn-dark btn-auth-submit" type="submit">Sign Up</button>
    </form>

    <div class="auth-divider"><span>OR</span></div>

    <div class="auth-social">
      <button type="button" class="btn-social" onclick="alert('Daftar Google akan segera hadir!')">
        <svg class="social-ic" width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.87c2.26-2.09 3.675-5.17 3.675-9.15z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3.05c-1.08.72-2.45 1.16-4.06 1.16-3.13 0-5.78-2.11-6.73-4.96H1.27v3.15C3.26 21.36 7.36 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24A7.18 7.18 0 0 1 4.9 12c0-.78.14-1.54.37-2.24V6.61H1.27A11.97 11.97 0 0 0 0 12c0 1.92.45 3.74 1.27 5.39l4-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.27 6.61l4 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
        <span>With Google</span>
      </button>
      <button type="button" class="btn-social" onclick="alert('Daftar Telegram akan segera hadir!')">
        <svg class="social-ic" width="18" height="18" viewBox="0 0 24 24"><path fill="#0088cc" d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-1.97 9.28c-.15.65-.53.81-1.08.5l-3-2.21-1.45 1.4c-.16.16-.3.3-.61.3l.21-3.05 5.56-5.02c.24-.22-.05-.34-.38-.12L9.4 13.62l-2.96-.92c-.64-.2-.66-.64.13-.95l11.57-4.46c.54-.2 1.01.13.82.87z"/></svg>
        <span>With Telegram</span>
      </button>
    </div>

    <p class="switch-line">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>

<script src="/js/auth-page.js"></script>
</body>
</html>
