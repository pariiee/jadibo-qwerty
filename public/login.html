<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk — YaaParBot</title>
<!-- @include head.html -->
</head>
<body class="page-auth" data-mode="login">

<!-- Sama persis dengan modal di index.html, biar satu gaya dan satu endpoint.
     Halaman baru lain tinggal copy file ini ganti data-mode. -->
<!-- Tema: halaman ini nggak pakai topbar/nav, tapi tombolnya tetap dikasih —
     warna gelap/terang kepakai di SEMUA halaman, jangan cuma yang ber-topbar. -->
<button class="theme-btn theme-btn-auth" data-act="toggleTheme" aria-label="Ganti tema" title="Ganti tema">
  <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<div class="auth-wrap">
  <div class="modal" id="auth-login">
    <h3>Masuk</h3>
    <p class="m-sub">Lanjutkan ke dashboard kamu</p>
    <form id="login-form">
      <div class="field">
        <label for="login-username">Username</label>
        <input class="inp" id="login-username" type="text" placeholder="Username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input class="inp" id="login-password" type="password" placeholder="Password" autocomplete="current-password" required />
      </div>
      <div class="err" id="login-error"></div>
      <button class="btn btn-dark" type="submit">Masuk</button>
    </form>
    <p class="switch-line">Belum punya akun? <a href="/register">Daftar</a></p>
  </div>

  <div class="modal" id="auth-register" style="display:none">
    <h3>Daftar</h3>
    <p class="m-sub">Buat akun baru</p>
    <form id="register-form">
      <div class="field">
        <label for="reg-username">Username</label>
        <input class="inp" id="reg-username" type="text" placeholder="Username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input class="inp" id="reg-password" type="password" placeholder="Min. 6 karakter" autocomplete="new-password" required />
      </div>
      <div class="err" id="reg-error"></div>
      <button class="btn btn-dark" type="submit">Buat Akun</button>
    </form>
    <p class="switch-line">Sudah punya akun? <a href="/login">Masuk</a></p>
  </div>
</div>

<script src="/js/auth-page.js"></script>
</body>
</html>
