<div class="panel form" id="cfg-panel">
  <h2>Konfigurasi Bot</h2>
  <form id="cfg-form" class="cfg-grid-form">
    <div class="field" id="w-name">
      <label for="cfg-name">Nama Bot <span class="req">*</span></label>
      <input class="inp" id="cfg-name" type="text" required />
    </div>
    <div class="field" id="w-botnum">
      <label for="cfg-botnum">Nomor Bot WA</label>
      <input class="inp" id="cfg-botnum" type="text" placeholder="628xxxxxxxxxx" />
      <div class="hint">Nomor WA yang dipair</div>
    </div>
    <div class="field tg-field" id="w-token">
      <label for="cfg-token">Token Bot</label>
      <div class="token-input-wrap">
        <input class="inp" id="cfg-token" type="password" autocomplete="off" />
        <button type="button" data-act="toggleToken" id="token-toggle" aria-label="Lihat token" title="Lihat token">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="hint" id="token-hint"></div>
    </div>

    <div class="field f-full" id="w-desc">
      <label for="cfg-desc">Deskripsi</label>
      <textarea class="inp" id="cfg-desc" rows="2" placeholder="Deskripsi singkat mengenai bot kamu"></textarea>
    </div>

    <div class="field" id="w-ownername">
      <label for="cfg-ownername">Nama Owner</label>
      <input class="inp" id="cfg-ownername" type="text" placeholder="Nama kontak owner" />
      <div class="hint">Nama di vCard .owner</div>
    </div>
    <div class="field" id="w-owner">
      <label for="cfg-owner">Nomor Owner <span class="req">*</span></label>
      <input class="inp" id="cfg-owner" type="text" required placeholder="628xxxxxxxxxx" />
      <div class="hint">Akses command owner-only</div>
    </div>

    <div class="field f-full" id="w-prefix">
      <label>Prefix Command <small style="font-weight:600;color:#5E5C70">(Bisa pilih lebih dari satu)</small></label>
      <div class="pfx-chips" id="cfg-pfx-chips">
        <button type="button" class="pfx-chip" data-act="togglePfx" data-pfx=".">.</button>
        <button type="button" class="pfx-chip" data-act="togglePfx" data-pfx="/">/</button>
        <button type="button" class="pfx-chip" data-act="togglePfx" data-pfx="!">!</button>
        <button type="button" class="pfx-chip" data-act="togglePfx" data-pfx="#">#</button>
        <button type="button" class="pfx-chip" data-act="togglePfx" data-pfx="?">?</button>
        <button type="button" class="pfx-chip" data-act="togglePfx" data-pfx="$">$</button>
      </div>
      <input type="hidden" id="cfg-prefix" value="." />
    </div>
    <div class="field" id="w-daily">
      <label for="cfg-daily">Limit Harian</label>
      <input class="inp" id="cfg-daily" type="number" min="1" max="9999" placeholder="20" />
      <div class="hint">Reset harian jam 00:00 WIB</div>
    </div>

    <div class="field" id="w-footer">
      <label for="cfg-footer">Footer</label>
      <input class="inp" id="cfg-footer" type="text" />
    </div>
    <div class="field" id="w-channel">
      <label for="cfg-channel">Channel ID (Broadcast)</label>
      <input class="inp" id="cfg-channel" type="text" placeholder="120363xxxxxxxxxx@newsletter" />
      <div class="hint">JID channel WA untuk .bc</div>
    </div>

    <div class="field" id="w-banner">
      <label for="cfg-banner">Banner URL (link gambar)</label>
      <input class="inp" id="cfg-banner" type="text" placeholder="https://..." />
      <div class="hint">Gambar untuk .menu</div>
    </div>
    <div class="field" id="w-qris">
      <label for="cfg-qris">QRIS URL (link gambar)</label>
      <input class="inp" id="cfg-qris" type="text" placeholder="https://..." />
      <div class="hint">Gambar QRIS untuk .pay</div>
    </div>

    <div class="field f-full" id="w-maingroups">
      <label for="cfg-maingroups">Grup Utama</label>
      <textarea class="inp" id="cfg-maingroups" rows="3" style="font-family:Consolas,Menlo,monospace" placeholder="120363xxxxxxxxxx@g.us"></textarea>
      <div class="hint">ID grup / <code>.gcutama</code>. Satu per baris. Kosongkan = respon semua grup.</div>
    </div>

    <div class="err f-full" id="cfg-err"></div>
    <button class="btn btn-dark save f-full" type="submit">Simpan Perubahan</button>
  </form>
</div>
