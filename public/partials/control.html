<div class="panel" id="ctrl-panel">
  <h2>Kontrol Bot</h2>
  <div class="ctrl-grid">
    <button class="btn btn-ok" id="btn-start" data-act="startBot">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
      Start
    </button>
    <button class="btn btn-stop" id="btn-stop" data-act="stopBot" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      Stop

      Restart

      Hapus Sesi
