<div class="panel" id="ctrl-panel">
  <h2>Kontrol Bot</h2>
  <div class="ctrl-grid">
    <button class="btn btn-ok" id="btn-start" data-act="startBot">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
      Start
    </button>
    <button class="btn btn-stop" id="btn-stop" data-act="stopBot" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      Stop
    </button>
    <button class="btn btn-outline" data-act="restartBot">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M1 4v6h6m16 10v-6h-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.5 9A8.5 8.5 0 0 0 5.6 5.6L1 10m22 4-4.6 4.4A8.5 8.5 0 0 1 3.5 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Restart
    </button>
    <button class="btn btn-outline" data-act="clearSession">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10 11v6m4-6v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Hapus Sesi
    </button>
  </div>
  <div class="ctrl-msg" id="ctrl-msg"></div>
</div>
